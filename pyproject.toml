[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "divya"
version = "0.1.0"
description = "India-first market-intelligence terminal: a System-2 reasoning model and a System-1 typed-decision engine over a shared-state recurrent loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Divya contributors" }]
keywords = ["market-intelligence", "india", "equities", "agent", "calibration"]

# Core runtime is deliberately light. `laya` pulls torch/transformers; keeping it in a
# separate extra lets `pytest` run the protocol/runtime/eval layers on a box with no
# Laya checkpoint installed, which is what CI and the degradation tests need.
# Core must be enough to run the test suite, the CLI and the evaluation metrics from a
# fresh clone. A clean-clone check on 2026-09-28 caught this being wrong: metrics needs
# numpy and the terminal view needs rich, and neither was here, so `make setup && make test`
# failed on a clean checkout while passing in a working directory.
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
system1 = ["laya>=0.3.21"]
system2 = ["httpx>=0.27"]
eval = ["scikit-learn>=1.3"]
terminal = ["textual>=0.60"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "types-requests",
]
all = [
    "laya>=0.3.21",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "textual>=0.60",
]

[project.scripts]
divya = "divya.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/divya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires a resident Laya checkpoint or a local LLM",
    "integration: crosses a process or network boundary",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
# Verified against the interpreter this project actually runs on. The package still
# supports 3.10 at runtime; only static checking is pinned to the verified version.
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
